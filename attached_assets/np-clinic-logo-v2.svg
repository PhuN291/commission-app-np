<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&amp;display=swap');
      .clinic-name { font-family: 'Be Vietnam Pro', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- NP Monogram -->
  <g transform="translate(8, 5)">
    <!-- N letter - outlined -->
    <path d="M0,65 L0,5 L8,5 L8,45 L38,5 L46,5 L46,65 L38,65 L38,25 L8,65 Z"
          fill="none" stroke="#1a8a7d" stroke-width="3"/>
    <!-- P letter with medical cross -->
    <g transform="translate(28, 0)">
      <path d="M8,5 L8,65 L16,65 L16,42 L30,42 C42,42 48,34 48,24 C48,14 42,5 30,5 Z M16,13 L28,13 C36,13 40,17 40,24 C40,31 36,34 28,34 L16,34 Z"
            fill="#1a8a7d"/>
      <!-- Medical cross inside P bowl -->
      <rect x="25" y="18" width="10" height="3" rx="0.5" fill="white"/>
      <rect x="28.5" y="14.5" width="3" height="10" rx="0.5" fill="white"/>
    </g>
  </g>

  <!-- Text block -->
  <g>
    <!-- PHÒNG KHÁM -->
    <text x="105" y="28" class="clinic-name" font-size="16" font-weight="600" fill="#1a8a7d" letter-spacing="1.5">PHÒNG KHÁM</text>
    <!-- NGUYÊN PHƯƠNG -->
    <text x="105" y="56" class="clinic-name" font-size="24" font-weight="800" fill="#1b3654" letter-spacing="1">NGUYÊN PHƯƠNG</text>
  </g>

  <!-- Tagline -->
  <text x="180" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1a8a7d" letter-spacing="1.5">CÔNG NGHỆ TƯƠNG LAI - SỨC KHỎE TRONG TẦM TAY BẠN</text>
</svg>
